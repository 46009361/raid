<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="content-security-policy"
    content="default-src 'self'; connect-src https://corsproxy.io/">
    <title>Image Downloader for Reddit Achievements</title>
    <link rel="stylesheet" href="default.css">
    <script src="form.js" defer></script>
</head>
<body>
    <form id="imgForm">
        <p><label for="user">Enter a Reddit username:</label><br>
        <input id="user" name="user"></p>
        <p><label for="trophy">Which achievement?</label><br>
        <select id="trophy" name="trophy">
            <optgroup label="Building Community">
                <option value="monthly-top-25-commenter">Top 25% Commenter</option>
                <option value="monthly-top-25-poster">Top 25% Poster</option>
                <option value="monthly-top-10-commenter">Top 10% Commenter</option>
                <option value="monthly-top-10-poster">Top 10% Poster</option>
                <option value="monthly-top-5-commenter">Top 5% Commenter</option>
                <option value="monthly-top-5-poster">Top 5% Poster</option>
                <option value="monthly-top-1-commenter">Top 1% Commenter</option>
                <option value="monthly-top-1-poster">Top 1% Poster</option>
                <option value="advisor-mod">Advisor Mod</option>
                <option value="alumni-mod">Alumni Mod</option>
                <option value="super-contributor">Super Contributor</option>
                <option value="frequent-contributor">Repeat Contributor</option>
                <option value="avid-curator">Content Connoisseur</option>
                <option value="post-explorer">Flag Planter</option>
                <option value="elder">Elder</option>
                <option value="rising-star">Rising Star</option>
                <option value="picasso">Picasso</option>
                <option value="thats-me">That's Me</option>
            </optgroup>
            <optgroup label="Reddit Streak">
                <option value="14">5-Day Streak</option>
                <option value="15">10-Day Streak</option>
                <option value="16">20-Day Streak</option>
                <option value="17">30-Day Streak</option>
                <option value="18">40-Day Streak</option>
                <option value="19">50-Day Streak</option>
                <option value="75-day-streak">75-Day Streak</option>
                <option value="100-day-streak">100-Day Streak</option>
                <option value="150-day-streak">150-Day Streak</option>
                <option value="200-day-streak">200-Day Streak</option>
                <option value="300-day-streak">300-Day Streak</option>
                <option value="365-day-streak">365-Day Streak</option>
                <option value="400-day-streak">400-Day Streak</option>
                <option value="500-day-streak">500-Day Streak</option>
                <option value="600-day-streak">600-Day Streak</option>
                <option value="700-day-streak">700-Day Streak</option>
                <option value="basement-dweller">Basement Dweller</option>
                <option value="grass-toucher">Grass Toucher</option>
                <option value="1000-day-streak">1000-Day Streak</option>
            </optgroup>
            <optgroup label="Exploration">
                <option value="9">Hometown Hero</option>
                <option value="10">New Share</option>
                <option value="sharing-enthusiast">Sharing Enthusiast</option>
                <option value="sharing-advocate">Sharing Advocate</option>
                <option value="sharing-pro">Sharing Pro</option>
                <option value="sharing-legend">Sharing Legend</option>
                <option value="banana-baby">Banana Baby</option>
                <option value="banana-beginner">Banana Beginner</option>
                <option value="banana-enthusiast">Banana Enthusiast</option>
                <option value="banana-aficionado">Banana Aficionado</option>
                <option value="banana-master">Banana Master</option>
                <option value="banana-legend">Banana Legend</option>
                <option value="potassium-overlord">Potassium Overlord</option>
                <option value="11">Conversation Starter</option>
                <option value="12">Nice Post</option>
                <option value="buzz-worthy-post">Buzz-Worthy Post</option>
                <option value="popular-post">Popular Post</option>
                <option value="premiere-post">Premiere Post</option>
                <option value="peak-post">Peak Post</option>
                <option value="13">Cool Comment</option>
                <option value="quality-comment">Quality Comment</option>
                <option value="captivating-comment">Captivating Comment</option>
            </optgroup>
            <optgroup label="Getting Started">
                <option value="1">Joined Reddit</option>
                <option value="2">Secured Account</option>
                <option value="3">Newcomer</option>
                <option value="4">Person of Interests</option>
                <option value="5">Profile Perfectionist</option>
                <option value="6">Feed Finder</option>
                <option value="7">Detective Doggo</option>
            </optgroup>
            <optgroup label="Community Moderation">
                <option value="basecamp-bag">Basecamp Bag</option>
                <option value="grand-sprouting">Grand Sprouting</option>
                <option value="support-network">Support Network</option>
                <option value="mod-hatchling">Mod Hatchling</option>
                <option value="mod-awakening">Mod Awakening</option>
                <option value="purrfect-pair">Purrfect Pair</option>
                <option value="mod-of-the-people">Mod of the People</option>
                <option value="mod-in-tights">Mod in Tights</option>
                <option value="weekly-visitors-5">5 Weekly Visitors</option>
                <option value="weekly-visitors-25">25 Weekly Visitors</option>
                <option value="weekly-visitors-100">100 Weekly Visitors</option>
                <option value="weekly-visitors-1k">1,000 Weekly Visitors</option>
                <option value="weekly-visitors-10k">10,000 Weekly Visitors</option>
                <option value="weekly-visitors-100k">100,000 Weekly Visitors</option>
                <option value="weekly-visitors-1M">1,000,000 Weekly Visitors</option>
            </optgroup>
        </select></p>
        <p><label for="lang">Language of image (not always supported):</label><br>
        <select id="lang" name="lang">
            <!-- These are copied from scratch.mit.edu directly.
            If "Joined Reddit" isn't translated, it is removed. -->
            <option value="ab">Аҧсшәа</option>
            <option value="af">Afrikaans</option>
            <option value="ar">العربية</option>
            <option value="az">Azeri</option>
            <option value="id">Bahasa Indonesia</option>
            <option value="bn">বাংলা</option>
            <option value="be">Беларуская</option>
            <option value="bg">Български</option>
            <option value="cs">Česky</option>
            <option value="da">Dansk</option>
            <option value="de">Deutsch</option>
            <option value="et">Eesti</option>
            <option value="el">Ελληνικά</option>
            <option value="en" selected>English</option>
            <option value="es">Español (España)</option>
            <option value="es-419">Español Latinoamericano</option>
            <option value="eu">Euskara</option>
            <option value="fa">فارسی</option>
            <option value="fil">Filipino</option>
            <option value="fr">Français</option>
            <option value="fy">Frysk</option>
            <option value="gl">Galego</option>
            <option value="ko">한국어</option>
            <option value="hy">Հայերեն</option>
            <option value="he">עִבְרִית</option>
            <option value="hi">हिंदी</option>
            <option value="hr">Hrvatski</option>
            <option value="it">Italiano</option>
            <option value="kk">қазақша</option>
            <option value="qu">Kichwa</option>
            <option value="ht">Kreyòl ayisyen</option>
            <option value="ku">Kurdî</option>
            <option value="ckb">کوردیی ناوەندی</option>
            <option value="hu">Magyar</option>
            <option value="mn">Монгол хэл</option>
            <option value="nl">Nederlands</option>
            <option value="ja">日本語</option>
            <!-- only the bottom text is translated for ja-Hira -->
            <option value="ja-Hira">にほんご</option>
            <option value="nb">Norsk Bokmål</option>
            <option value="nn">Norsk Nynorsk</option>
            <option value="oc">Occitan</option>
            <option value="uz">Oʻzbekcha</option>
            <option value="th">ไทย</option>
            <option value="pl">Polski</option>
            <option value="pt">Português</option>
            <option value="pt-BR">Português Brasileiro</option>
            <option value="ro">Română</option>
            <option value="ru">Русский</option>
            <option value="tn">Setswana</option>
            <option value="sk">Slovenčina</option>
            <option value="sr">Српски</option>
            <option value="fi">Suomi</option>
            <option value="sv">Svenska</option>
            <option value="vi">Tiếng Việt</option>
            <option value="tr">Türkçe</option>
            <option value="uk">Українська</option>
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
        </select></p>
        <p><input type="checkbox" id="show" name="show" checked>
        <label for="show">Show username and avatar</label></p>
        <p><button type="submit">Get Image</button></p>
    </form>
    <img src="" alt="Image of achievement" class="hidden" id="earned">
    <small>Currently, there is no download button, but you can right-click or hold and save the image.<br>
    Normally, you would need to log into the username specified on the mobile app to save this image
        or view the achievement's unlock number.<br>
    All code is 100% me.</small>
</body>
</html>
